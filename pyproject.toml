[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-workflow-engine"
version = "1.0.0"
description = "A DAG-based workflow orchestration engine for ML pipelines"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Maharshi Soni"}
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
ml = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.scripts]
dag-engine = "dag_workflow_engine.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["dag_workflow_engine*"]
